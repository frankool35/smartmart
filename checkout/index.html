<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Complete your SmartMart order.">

    <title>Checkout | SmartMart</title>

    <link rel="stylesheet" href="../src/css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <img src="../src/images/smartmart-logo.png" alt="SmartMart">
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="../products/">Products</a>

                <a href="../cart/" class="cart-link" aria-label="Shopping cart">
                    <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 7H6" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="10" cy="20" r="1.5" fill="currentColor" />
                        <circle cx="18" cy="20" r="1.5" fill="currentColor" />
                    </svg>

                    <span class="cart-label">Cart</span>

                    <span id="cart-count" class="cart-count" aria-label="Items in cart"></span>
                </a>
            </nav>
        </div>
    </header>

    <main>

        <section class="page-header">
            <div class="container">
                <h1>Checkout</h1>

                <p>
                    Enter your information to complete your order.
                </p>
            </div>
        </section>

        <section class="checkout-section">
            <div class="container">

                <div class="checkout-layout">

                    <form id="checkout-form" class="checkout-form">

                        <h2>Customer Information</h2>

                        <div class="form-group">
                            <label for="full-name">
                                Full Name
                            </label>

                            <input type="text" id="full-name" name="fullName" required autocomplete="name">
                        </div>

                        <div class="form-group">
                            <label for="email">
                                Email Address
                            </label>

                            <input type="email" id="email" name="email" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label for="phone">
                                Phone Number
                            </label>

                            <input type="tel" id="phone" name="phone" required autocomplete="tel">
                        </div>

                        <div class="form-group">
                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea id="address" name="address" rows="4" required
                                autocomplete="street-address"></textarea>
                        </div>

                        <h2 class="payment-heading">Payment Information</h2>

                        <div class="form-group">
                            <label for="card-name">
                                Cardholder Name
                            </label>

                            <input type="text" id="card-name" name="cardName" required autocomplete="cc-name">
                        </div>

                        <div class="form-group">
                            <label for="card-number">
                                Card Number
                            </label>

                            <input type="text" id="card-number" name="cardNumber" required inputmode="numeric"
                                autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="19">
                        </div>

                        <div class="payment-row">

                            <div class="form-group">
                                <label for="expiry">
                                    Expiry Date
                                </label>

                                <input type="text" id="expiry" name="expiry" required inputmode="numeric"
                                    autocomplete="cc-exp" placeholder="MM/YY" maxlength="5">
                            </div>

                            <div class="form-group">
                                <label for="cvv">
                                    CVV
                                </label>

                                <input type="password" id="cvv" name="cvv" required inputmode="numeric"
                                    autocomplete="cc-csc" placeholder="123" maxlength="4">
                            </div>

                        </div>

                        <button type="submit" class="btn">
                            Place Order
                        </button>

                    </form>

                    <aside id="order-summary" class="order-summary">
                        <h2>Order Summary</h2>

                        <p>Loading order summary...</p>
                    </aside>

                </div>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 SmartMart. Smart Shopping. Everyday Essentials.
            </p>
        </div>
    </footer>

    <script type="module" src="../src/js/checkout.js"></script>
    <script type="module" src="../src/js/cart-count.js"></script>

</body>

</html>
