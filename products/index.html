<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Browse products at SmartMart.">

    <title>Products | SmartMart</title>

    <link rel="stylesheet" href="../src/css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                SmartMart
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="./">Products</a>
            <a href="../cart/" class="cart-link" aria-label="Shopping cart">
                <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 7H6" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="10" cy="20" r="1.5" fill="currentColor" />
                    <circle cx="18" cy="20" r="1.5" fill="currentColor" />
                </svg>
            
                <span class="cart-label">Cart</span>
            
                <span id="cart-count" class="cart-count" aria-label="Items in cart"></span>
            </a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Products</h1>

                <p>
                    Browse our everyday products and find what you need.
                </p>
            </div>
        </section>

        <section class="products-section">
            <div class="container">
                <div id="currency-rate" class="currency-rate">
                    Loading exchange rate...
                </div>

            <div class="products-controls">
            
                <div>
                    <label for="search">Search Products</label>
            
                    <input type="search" id="search" name="search" placeholder="Search for a product...">
                </div>
            
                <div>
                    <label for="category-filter">Category</label>
            
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                    </select>
                </div>
            
            </div>
<div>
    <label for="sort-products">Sort By</label>

    <select id="sort-products">
        <option value="default">Default</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
    </select>
</div>

                <div id="product-list" class="product-grid" aria-live="polite">
                    <p class="loading-message">Loading products...</p>
                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 SmartMart. Smart Shopping. Everyday Essentials.
            </p>
        </div>
    </footer>

    <script type="module" src="../src/js/products.js"></script>
    <script type="module" src="../src/js/cart-count.js"></script>

</body>

</html>
