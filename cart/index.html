<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="View and manage your SmartMart shopping cart.">

    <title>Shopping Cart | SmartMart</title>

    <link rel="stylesheet" href="../src/css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                SmartMart
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="../products/">Products</a>
                <a href="./" class="cart-link" aria-label="Shopping cart">
                    <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 7H6" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="10" cy="20" r="1.5" fill="currentColor" />
                        <circle cx="18" cy="20" r="1.5" fill="currentColor" />
                    </svg>
                
                    <span class="cart-label">Cart</span>
                
                    <span id="cart-count" class="cart-count" aria-label="Items in cart"></span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Shopping Cart</h1>

                <p>
                    Review your selected products before checkout.
                </p>
            </div>
        </section>

        <section class="cart-section">
            <div class="container">

                <div id="cart-items">
                    <p>Loading cart...</p>
                </div>

                <div id="cart-summary">
                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 SmartMart. Smart Shopping. Everyday Essentials.
            </p>
        </div>
    </footer>

<script type="module" src="../src/js/cart.js"></script>
<script type="module" src="../src/js/cart-count.js"></script>

</body>

</html>
